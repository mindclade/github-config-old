---
baseline-all:
  target: all
  enforcement: active
merge-queue:
  classes:
    - production-control
    - source-monorepo
  enforcement: active
protected-paths:
  classes:
    - enterprise-control
    - production-control
  enforcement: active
push-blocklist:
  target: all-private-internal
  enforcement: active
required-checks-go:
  language_profiles:
    - go
    - mixed
  # Promote to active only after the real monorepo reports these exact contexts.
  enforcement: evaluate
required-checks-mixed:
  language_profiles:
    - mixed
  # Promote to active only after the real monorepo reports these exact contexts.
  enforcement: evaluate
required-checks-tf:
  repositories:
    - github-config
    - infrastructure-live
  enforcement: active
required-checks-tf-static:
  repositories:
    - github-config
    - infrastructure-live
  enforcement: active
required-checks-tf-tests:
  repositories:
    - github-config
  enforcement: active
ruleset-workflows:
  classes:
    - enterprise-control
    - production-control
    - source-monorepo
  enforcement: active
  workflow_ref: refs/tags/v3.0.0
tag-protection:
  target: all
  enforcement: active
