---
baseline-all:
  target: all
  enforcement: active
merge-queue:
  classes:
    - production-control
    - source-monorepo
  enforcement: active
protected-paths:
  classes:
    - enterprise-control
    - production-control
  enforcement: active
release-authority-paths:
  repositories:
    - mindclade-internal-monorepo
  enforcement: active
push-blocklist:
  target: all-private-internal
  enforcement: active
required-checks-bootstrap:
  repositories:
    - bootstrap
  enforcement: active
required-checks-go:
  language_profiles:
    - go
    - mixed
  # Promote to active only after the real monorepo reports these exact contexts.
  enforcement: evaluate
required-checks-infra-static:
  repositories:
    - mindclade-internal-monorepo
  # Observe pull-request and merge-group reporting before promotion to active. The
  # implementation and tests are enforcement-ready; changing this value is a separate,
  # reviewed GitHub governance rollout.
  enforcement: evaluate
required-checks-gitops:
  repositories:
    - gitops
  # Credential-free merge-group gates only. Render and provenance remain explicit activation
  # evidence until those cross-repository/cloud trust workflows support merge_group safely.
  enforcement: active
required-checks-mixed:
  language_profiles:
    - mixed
  # Promote to active only after the real monorepo reports these exact contexts.
  enforcement: evaluate
required-checks-tf:
  repositories:
    - github-config
    - infrastructure-live
  enforcement: active
required-checks-tf-static:
  repositories:
    - github-config
    - infrastructure-live
  enforcement: active
required-checks-tf-tests:
  repositories:
    - github-config
  enforcement: active
ruleset-workflows:
  classes:
    - enterprise-control
    - production-control
    - source-monorepo
  enforcement: active
  workflow_ref: refs/tags/v4.0.0
tag-protection:
  target: all
  enforcement: active
