---
baseline-all:
  target: all
  enforcement: active
merge-queue:
  classes:
    - production-control
    - source-monorepo
  enforcement: active
protected-paths:
  classes:
    - enterprise-control
    - production-control
  enforcement: active
legal-policy-paths:
  target: all
  # Legal remains an explicitly deferred IdP mapping. Keep the new three-function reviewer
  # contract in evaluate mode until Legal, Platform, and Security are independently staffed,
  # connected rule insights are reviewed, and the signed policy bundle/App are qualified.
  enforcement: evaluate
release-authority-paths:
  repositories:
    - mindclade-internal-monorepo
  enforcement: active
release-tag-creation:
  target: all
  # Stage this new organization-wide rule in Insights before enforcement. Promotion is a
  # separate reviewed change after the connected ruleset shape, immutable Release team id, and
  # exact plan are qualified. The no-bypass tag-protection ruleset remains active throughout.
  enforcement: evaluate
push-blocklist:
  target: all-private-internal
  enforcement: active
required-checks-bootstrap:
  repositories:
    - bootstrap
  # The source contract now expects the always-present plan / verdict context. Keep evaluate
  # until the bootstrap workflow is merged and that exact context is observed on both relevant
  # and documentation-only pull requests; the current live speculative gate remains untouched.
  enforcement: evaluate
required-checks-go:
  language_profiles:
    - go
    - mixed
  # Promote to active only after the real monorepo reports these exact contexts.
  enforcement: evaluate
required-checks-github-config:
  repositories:
    - github-config
  # The source workflow now provides this always-present context. Keep the resting contract
  # active; rollout-phase overrides stage its first connected creation in evaluate mode.
  enforcement: active
required-checks-infra-static:
  repositories:
    - mindclade-internal-monorepo
  # Observe pull-request and merge-group reporting before promotion to active. The
  # implementation and tests are enforcement-ready; changing this value is a separate,
  # reviewed GitHub governance rollout.
  enforcement: evaluate
required-checks-gitops:
  repositories:
    - gitops
  # Credential-free merge-group gates only. Render and provenance remain explicit activation
  # evidence until those cross-repository/cloud trust workflows support merge_group safely.
  enforcement: active
required-checks-mixed:
  language_profiles:
    - mixed
  # Promote to active only after the real monorepo reports these exact contexts.
  enforcement: evaluate
required-checks-nix:
  repositories:
    - .github
    - .github-private
    - bootstrap
    - github-config
    - gitops
    - infrastructure-live
    - mindclade-internal-monorepo
  # Observe the released reusable workflow on pull requests, merge groups, and scheduled
  # native runners before making this context merge-blocking.
  enforcement: evaluate
required-checks-tf:
  repositories:
    - infrastructure-live
  enforcement: active
required-checks-tf-static:
  repositories:
    - github-config
    - infrastructure-live
  enforcement: active
required-checks-tf-tests:
  repositories:
    - github-config
  enforcement: active
ruleset-workflows:
  classes:
    - enterprise-control
    - production-control
    - source-monorepo
  # The referenced tag does not exist yet. Evaluation is the only safe source state until the
  # reviewed v5 release is published, source-attested, and representative consumers pass.
  enforcement: evaluate
  workflow_ref: refs/tags/v5.0.0
tag-protection:
  target: all
  enforcement: active
