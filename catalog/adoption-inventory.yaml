  - resource_class: terraform_state
    reason: The remote state address inventory was not readable; every known-existing address must be proven imported before activation.
  - resource_class: organization_rulesets
    reason: The connected credential lacks admin:org and cannot enumerate organization rulesets directly; repository-effective reads show only push-blocklist and tag-protection, so absence of the other desired rulesets is not proven.
  - resource_class: unmanaged_environments
    reason: Read-only inventory found auto-created copilot environments outside the governed catalog; ownership and disposition require separate review, and this change neither imports nor deletes them.
  - resource_class: workflow_release_environments
    reason: The .github repository has zero live environments; workflow-release-platform and workflow-release-security remain desired create operations blocked on independent reviewer staffing and exact-plan review.
  - resource_class: github_app_installations
    reason: The read-only inventory found zero installations; all four App contracts require creation and connected permission/selection qualification.
  - resource_class: runner_groups
    reason: Runner-group enumeration was inaccessible with the connected credential.
  - resource_class: idp_membership
    reason: Six catalog teams remain deferred and idp/team-members.json is intentionally absent from source.
  - resource_class: custom_properties
    reason: Eight definitions and their repository values exist live but their Terraform import/state adoption is not proven.
  - resource_class: team_access_and_membership
    reason: Team repository grants and IdP-projected memberships have not been reconciled against Terraform state.
  - resource_class: actions_and_oidc
    reason: Organization Actions settings, variables, environments, and immutable repository OIDC subjects need complete import/state evidence.
