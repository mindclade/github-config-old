---
enabled_repositories: all
allowed_actions: selected
default_workflow_permissions: read
can_approve_pull_request_reviews: false
sha_pinning_required: true
github_owned_allowed: false
verified_creator_allowed: false
allowed_action_patterns:
- actions/attest@*
- actions/cache@*
- actions/checkout@*
- actions/create-github-app-token@*
- actions/dependency-review-action@*
- actions/download-artifact@*
- actions/setup-go@*
- actions/setup-node@*
- actions/setup-python@*
- actions/upload-artifact@*
- anchore/sbom-action@*
- aquasecurity/trivy-action@*
- astral-sh/setup-uv@*
- bazel-contrib/setup-bazel@*
- bridgecrewio/checkov-action@*
- cachix/install-nix-action@*
- docker/build-push-action@*
- docker/metadata-action@*
- docker/setup-buildx-action@*
- dtolnay/rust-toolchain@*
- github/codeql-action/*@*
- golangci/golangci-lint-action@*
- google-github-actions/auth@*
- google-github-actions/get-secretmanager-secrets@*
- google-github-actions/setup-gcloud@*
- google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@*
- hashicorp/setup-terraform@*
- infracost/actions/setup@*
- Mindclade/.github/.github/workflows/*@*
- ossf/scorecard-action@*
- pnpm/action-setup@*
- pre-commit/action@*
- terraform-linters/setup-tflint@*
