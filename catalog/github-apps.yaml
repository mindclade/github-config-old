---
mindclade-arc:
  purpose: Register ephemeral ARC runners for the artifact-authority repository only.
  repositories:
    - mindclade-internal-monorepo
  organizationPermissions:
    selfHostedRunners: write
  repositoryPermissions:
    actions: read
    metadata: read
mindclade-release-promoter:
  purpose: Open review-only digest promotion pull requests in GitOps.
  repositories:
    - gitops
  organizationPermissions: {}
  repositoryPermissions:
    contents: write
    metadata: read
    pullRequests: write
