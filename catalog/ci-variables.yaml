# Non-secret Actions variables. `env:NAME` means export-ci-variables.py must obtain the value
# from the operator environment; `handoff:NAME` accepts only the exact applied infrastructure-live
# evidence contract. Unresolved or empty values fail before GitHub is changed.
---
.github:
  PIN_AUDIT_APP_ID: env:PIN_AUDIT_APP_ID

.github-private: {}

github-config:
  ORGANIZATION: mindclade
  # Connected drift remains staged until the read/plan App installation, exact permissions,
  # selected repositories, and protected private key have passed the connected audit.
  GOVERNANCE_CONNECTED_DRIFT: "false"
  # Keep operator-derived until the billing group mailbox is actually provisioned.
  BILLING_EMAIL: env:BILLING_EMAIL
  # Initial governance creates and protects environments before infrastructure-live exists.
  # Promote this to env:ENVIRONMENT_PROJECT_IDS only with exact applied infrastructure outputs.
  ENVIRONMENT_PROJECT_IDS: '{}'
  TF_PLAN_APP_ID: env:TF_PLAN_APP_ID
  TF_APPLY_APP_ID: env:TF_APPLY_APP_ID

bootstrap:
  # export-ci-variables.py augments this catalog from bootstrap platform_contract 1.2.0. In
  # particular, organization/billing/GitHub immutable IDs and state buckets come directly from
  # that machine contract; operators cannot substitute free-form copies of those identifiers.
  RESOURCE_PREFIX: mc
  GCP_REGION: us-central1
  STATE_BUCKET_LOCATION: US
  STATE_KMS_LOCATION: us
  STATE_REPLICA_LOCATION: europe-west4
  STATE_REPLICA_KMS_LOCATION: europe-west4
  BREAK_GLASS_PRINCIPALS_JSON: env:BREAK_GLASS_PRINCIPALS_JSON
  # Full activation targets the provisioned security group. Bootstrap-stage export instead
  # requires SECURITY_CONTACT from the operator so it preserves the current live recipient.
  SECURITY_CONTACT: security@mindclade.com
  # The current Ring-0 contract deliberately disables Buildkite. The exporter omits all
  # UUID-derived Buildkite inputs until both this flag and platform_contract agree on enabled.
  ENABLE_BUILDKITE_WIF: "false"
  BUILDKITE_ORGANIZATION_ID: env:BUILDKITE_ORGANIZATION_ID
  BUILDKITE_PIPELINE_IDS_JSON: env:BUILDKITE_PIPELINE_IDS_JSON
  BUILDKITE_PIPELINE_STEP_CONTRACTS_JSON: env:BUILDKITE_PIPELINE_STEP_CONTRACTS_JSON

infrastructure-live:
  TF_APP_ID: env:TF_APP_ID
  CLOUD_IDENTITY_CUSTOMER_ID: env:CLOUD_IDENTITY_CUSTOMER_ID
  ORG_POLICY_ACTIVATION_PHASE: baseline
  MONOREPO_ORG: mindclade
  RESOURCE_PREFIX: mc
  PRIMARY_REGION: us-central1
  GPU_ZONE: us-central1-b
  DOMAIN: mindclade.com

gitops:
  RENDER_APP_ID: env:RENDER_APP_ID
  MONOREPO_ORG: mindclade
  SECRETS_PROJECT_ID: mc-common-security
  BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: handoff:BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT
  BINAUTHZ_DEPLOYMENT_ATTESTOR: handoff:BINAUTHZ_DEPLOYMENT_ATTESTOR
  # infrastructure-live owns these normal-plane identities. Re-export its applied outputs;
  # github-config governs only the resulting non-secret GitHub variable handoff.
  SA_GITOPS_RENDER: handoff:SA_GITOPS_RENDER
  SA_GITOPS_VERIFIER: handoff:SA_GITOPS_VERIFIER

mindclade-internal-monorepo:
  ARTIFACT_REGISTRY_HOST: us-central1-docker.pkg.dev
  BUILDKITE_ORGANIZATION_ID: env:BUILDKITE_ORGANIZATION_ID
  BUILDKITE_BUILD_PIPELINE_ID: env:BUILDKITE_BUILD_PIPELINE_ID
  BUILDKITE_QUALIFICATION_PIPELINE_ID: env:BUILDKITE_QUALIFICATION_PIPELINE_ID
  BUILDKITE_PROMOTION_PIPELINE_ID: env:BUILDKITE_PROMOTION_PIPELINE_ID
  BUILDKITE_BUILDER_IDENTITY: env:BUILDKITE_BUILDER_IDENTITY
  BUILDKITE_QUALIFIER_IDENTITY: env:BUILDKITE_QUALIFIER_IDENTITY
  BUILDKITE_PROMOTER_IDENTITY: env:BUILDKITE_PROMOTER_IDENTITY
  DEV_PLATFORM_PROJECT_ID: mc-development-platform
  STAGING_PLATFORM_PROJECT_ID: mc-staging-platform
  PRODUCTION_PLATFORM_PROJECT_ID: mc-production-platform
  BINAUTHZ_BUILD_ATTESTOR_PROJECT: handoff:BINAUTHZ_BUILD_ATTESTOR_PROJECT
  BINAUTHZ_BUILD_ATTESTOR: handoff:BINAUTHZ_BUILD_ATTESTOR
  BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT: handoff:BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT
  BINAUTHZ_QUALIFICATION_ATTESTOR: handoff:BINAUTHZ_QUALIFICATION_ATTESTOR
  BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: handoff:BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT
  BINAUTHZ_DEPLOYMENT_ATTESTOR: handoff:BINAUTHZ_DEPLOYMENT_ATTESTOR
  BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION: handoff:BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION
  SA_ARTIFACT_SIGNER: handoff:SA_ARTIFACT_SIGNER
