# Non-secret Actions variables. `env:NAME` means export-ci-variables.py must obtain the value
# from the operator environment; unresolved or empty values fail before GitHub is changed.
---
.github:
  PIN_AUDIT_APP_ID: env:PIN_AUDIT_APP_ID

.github-private: {}

github-config:
  ORGANIZATION: mindclade
  # Keep operator-derived until the billing group mailbox is actually provisioned.
  BILLING_EMAIL: env:BILLING_EMAIL
  # Initial governance creates and protects environments before infrastructure-live exists.
  # Promote this to env:ENVIRONMENT_PROJECT_IDS only with exact applied infrastructure outputs.
  ENVIRONMENT_PROJECT_IDS: '{}'
  TF_PLAN_APP_ID: env:TF_PLAN_APP_ID
  TF_APPLY_APP_ID: env:TF_APPLY_APP_ID

bootstrap:
  # export-ci-variables.py augments this catalog from bootstrap platform_contract 1.3.0. In
  # particular, organization/billing/GitHub immutable IDs and state buckets come directly from
  # that machine contract; operators cannot substitute free-form copies of those identifiers.
  RESOURCE_PREFIX: mc
  GCP_REGION: us-central1
  STATE_BUCKET_LOCATION: US
  STATE_KMS_LOCATION: us
  STATE_REPLICA_LOCATION: europe-west4
  STATE_REPLICA_KMS_LOCATION: europe-west4
  BREAK_GLASS_PRINCIPALS_JSON: env:BREAK_GLASS_PRINCIPALS_JSON
  # Full activation targets the provisioned security group. Bootstrap-stage export instead
  # requires SECURITY_CONTACT from the operator so it preserves the current live recipient.
  SECURITY_CONTACT: security@mindclade.com
  # The ARC amendment permanently disables the retained Buildkite transition guard.
  ENABLE_BUILDKITE_WIF: "false"

infrastructure-live:
  TF_APP_ID: env:TF_APP_ID
  CLOUD_IDENTITY_CUSTOMER_ID: env:CLOUD_IDENTITY_CUSTOMER_ID
  ORG_POLICY_ACTIVATION_PHASE: baseline
  MONOREPO_ORG: mindclade
  RESOURCE_PREFIX: mc
  PRIMARY_REGION: us-central1
  GPU_ZONE: us-central1-b
  DOMAIN: mindclade.com

gitops:
  RENDER_APP_ID: env:RENDER_APP_ID
  MONOREPO_ORG: mindclade
  SECRETS_PROJECT_ID: mc-common-security
  BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: env:BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT
  BINAUTHZ_DEPLOYMENT_ATTESTOR: env:BINAUTHZ_DEPLOYMENT_ATTESTOR
  # infrastructure-live owns these normal-plane identities. Re-export its applied outputs;
  # github-config governs only the resulting non-secret GitHub variable handoff.
  SA_GITOPS_RENDER: env:SA_GITOPS_RENDER
  SA_GITOPS_VERIFIER: env:SA_GITOPS_VERIFIER

mindclade-internal-monorepo:
  ARTIFACT_REGISTRY_HOST: us-central1-docker.pkg.dev
  CI_PROJECT_ID: env:CI_PROJECT_ID
  SA_ARC_CANARY: env:SA_ARC_CANARY
  SA_ARTIFACT_BUILDER: env:SA_ARTIFACT_BUILDER
  SA_ARTIFACT_QUALIFICATION_READER: env:SA_ARTIFACT_QUALIFICATION_READER
  SA_ARTIFACT_QUALIFIER: env:SA_ARTIFACT_QUALIFIER
  SA_ARTIFACT_PROMOTER: env:SA_ARTIFACT_PROMOTER
  BINAUTHZ_BUILD_ATTESTOR_PROJECT: env:BINAUTHZ_BUILD_ATTESTOR_PROJECT
  BINAUTHZ_BUILD_ATTESTOR: env:BINAUTHZ_BUILD_ATTESTOR
  BINAUTHZ_BUILD_ATTESTOR_KEY_VERSION: env:BINAUTHZ_BUILD_ATTESTOR_KEY_VERSION
  BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT: env:BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT
  BINAUTHZ_QUALIFICATION_ATTESTOR: env:BINAUTHZ_QUALIFICATION_ATTESTOR
  BINAUTHZ_QUALIFICATION_ATTESTOR_KEY_VERSION: env:BINAUTHZ_QUALIFICATION_ATTESTOR_KEY_VERSION
  BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: env:BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT
  BINAUTHZ_DEPLOYMENT_ATTESTOR: env:BINAUTHZ_DEPLOYMENT_ATTESTOR
  BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION: env:BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION
  SA_ARTIFACT_SIGNER: env:SA_ARTIFACT_SIGNER
  ARC_PROMOTER_APP_ID: env:ARC_PROMOTER_APP_ID
  ARC_PROMOTER_SECRET_PROJECT: env:ARC_PROMOTER_SECRET_PROJECT
  ARC_PROMOTER_PRIVATE_KEY_SECRET: env:ARC_PROMOTER_PRIVATE_KEY_SECRET
  ARC_PROMOTER_PRIVATE_KEY_VERSION: env:ARC_PROMOTER_PRIVATE_KEY_VERSION
