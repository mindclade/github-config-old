# Non-secret Actions variables. `env:NAME` means export-ci-variables.py must obtain the value
# from the operator environment; unresolved or empty values fail before GitHub is changed.
---
.github:
  PIN_AUDIT_APP_ID: env:PIN_AUDIT_APP_ID
  ESTATE_OBSERVER_APP_ID: env:ESTATE_OBSERVER_APP_ID
  REF_JANITOR_APP_ID: env:REF_JANITOR_APP_ID

.github-private: {}

github-config:
  ORGANIZATION: mindclade
  # Connected drift remains staged until the read/plan App installation, exact permissions,
  # selected repositories, and protected private key have passed the connected audit.
  GOVERNANCE_CONNECTED_DRIFT: "false"
  # Keep operator-derived until the billing group mailbox is actually provisioned.
  BILLING_EMAIL: env:BILLING_EMAIL
  # Initial governance creates and protects environments before infrastructure-live exists.
  # Promote this to env:ENVIRONMENT_PROJECT_IDS only with exact applied infrastructure outputs.
  ENVIRONMENT_PROJECT_IDS: '{}'
  # A v1.4+ full export supplies this exact JSON object from bootstrap and the applied
  # infrastructure-live DR evidence outputs. Under the deployed v1.2 contract it remains
  # empty, so no future DR authority is activated early.
  DR_EVIDENCE_ENVIRONMENT_VARIABLES: '{}'
  TF_PLAN_APP_ID: env:TF_PLAN_APP_ID
  TF_APPLY_APP_ID: env:TF_APPLY_APP_ID

bootstrap:
  # export-ci-variables.py augments this catalog from the deployed bootstrap contract (v1.2)
  # and also accepts the reviewed v1.4 and v1.5 successors after Ring-0 activation. In
  # particular, organization/billing/GitHub immutable IDs and state buckets come directly from
  # that machine contract; operators cannot substitute free-form copies of those identifiers.
  RESOURCE_PREFIX: mc
  GCP_REGION: us-central1
  RESIDENCY_PROFILE: us-only-v1
  STATE_BUCKET_LOCATION: US
  STATE_KMS_LOCATION: us
  AUTOMATION_SECRET_LOCATION: us-central1
  STATE_REPLICA_LOCATION: us-east4
  STATE_REPLICA_KMS_LOCATION: us-east4
  # Must equal the first-apply disposition. Existing estates normally preserve the deployed
  # Europe replicas; a greenfield estate explicitly supplies false.
  PRESERVE_LEGACY_EU_STATE_REPLICAS: env:PRESERVE_LEGACY_EU_STATE_REPLICAS
  STATE_SOFT_DELETE_DAYS: "30"
  NONCURRENT_VERSION_DAYS: "90"
  NONCURRENT_VERSION_COUNT: "100"
  KMS_PROTECTION_LEVEL: SOFTWARE
  BREAK_GLASS_PRINCIPALS_JSON: env:BREAK_GLASS_PRINCIPALS_JSON
  # Full activation targets the provisioned security group. Bootstrap-stage export instead
  # requires SECURITY_CONTACT from the operator so it preserves the current live recipient.
  SECURITY_CONTACT: security@mindclade.com
  # The ARC amendment permanently disables the retained Buildkite transition guard.
  ENABLE_BUILDKITE_WIF: "false"

infrastructure-live:
  TF_APP_ID: env:TF_APP_ID
  CLOUD_IDENTITY_CUSTOMER_ID: env:CLOUD_IDENTITY_CUSTOMER_ID
  ORG_POLICY_ACTIVATION_PHASE: baseline
  MONOREPO_ORG: mindclade
  RESOURCE_PREFIX: mc
  RESIDENCY_PROFILE: us-only-v1
  PRIMARY_REGION: us-central1
  GPU_ZONE: us-central1-b
  DR_REGION: us-east4
  DR_GPU_ZONE: us-east4-b
  DOMAIN: mindclade.com
  # The full exporter replaces this fail-closed sentinel from bootstrap/platform_contract.
  PRODUCTION_QUALIFICATION_IDENTITY_JSON: '{}'
  # Bootstrap 1.5 replaces this inert sentinel with the exact dedicated provider and route
  # contract. It is an infrastructure input only; it does not activate a cache client.
  BAZEL_CACHE_IDENTITY_JSON: '{}'

gitops:
  RENDER_APP_ID: env:RENDER_APP_ID
  MONOREPO_ORG: mindclade
  SECRETS_PROJECT_ID: mc-common-security
  BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: env:BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT
  BINAUTHZ_DEPLOYMENT_ATTESTOR: env:BINAUTHZ_DEPLOYMENT_ATTESTOR
  # infrastructure-live owns these normal-plane identities. Re-export its applied outputs;
  # github-config governs only the resulting non-secret GitHub variable handoff.
  SA_GITOPS_RENDER: env:SA_GITOPS_RENDER
  SA_GITOPS_VERIFIER: env:SA_GITOPS_VERIFIER
  WIF_PROVIDER_PRODUCTION_QUALIFICATION: env:WIF_PROVIDER_PRODUCTION_QUALIFICATION
  SA_PRODUCTION_QUALIFICATION_EVALUATOR: env:SA_PRODUCTION_QUALIFICATION_EVALUATOR
  SA_PRODUCTION_QUALIFICATION_READER: env:SA_PRODUCTION_QUALIFICATION_READER
  SA_PRODUCTION_QUALIFICATION_WRITER: env:SA_PRODUCTION_QUALIFICATION_WRITER
  PRODUCTION_QUALIFICATION_PROJECT: env:PRODUCTION_QUALIFICATION_PROJECT
  PRODUCTION_QUALIFICATION_BUCKET: env:PRODUCTION_QUALIFICATION_BUCKET
  PRODUCTION_QUALIFICATION_APP_ID: env:PRODUCTION_QUALIFICATION_APP_ID
  PRODUCTION_QUALIFICATION_PRIVATE_KEY_SECRET: env:PRODUCTION_QUALIFICATION_PRIVATE_KEY_SECRET
  PRODUCTION_ELIGIBILITY_SIGNING_KEY_ID: env:PRODUCTION_ELIGIBILITY_SIGNING_KEY_ID
  PRODUCTION_ELIGIBILITY_KMS_KEY_VERSION: env:PRODUCTION_ELIGIBILITY_KMS_KEY_VERSION
  PRODUCTION_ELIGIBILITY_URL: https://mindclade.studio

mindclade-internal-monorepo:
  ARTIFACT_REGISTRY_HOST: us-central1-docker.pkg.dev
  ARTIFACT_REGISTRY_DR_HOST: us-east4-docker.pkg.dev
  CI_PROJECT_ID: env:CI_PROJECT_ID
  # This server-side half of the dual gate remains inert until the monorepo source contract,
  # restricted evidence, module release, and job-scoped OIDC permission are reviewed together.
  BAZEL_REMOTE_CACHE_STATE: blocked
  # These values may come only from applied handoff 1.4.0 after bootstrap 1.5 and the
  # authoritative automation IAM unit have both been applied. Raw operator values are rejected.
  WIF_PROVIDER_BAZEL_CACHE: env:WIF_PROVIDER_BAZEL_CACHE
  SA_BAZEL_CACHE_READER: env:SA_BAZEL_CACHE_READER
  SA_BAZEL_CACHE_WRITER: env:SA_BAZEL_CACHE_WRITER
  SA_ARC_CANARY: env:SA_ARC_CANARY
  SA_ARTIFACT_BUILDER: env:SA_ARTIFACT_BUILDER
  SA_ARTIFACT_QUALIFICATION_READER: env:SA_ARTIFACT_QUALIFICATION_READER
  SA_ARTIFACT_QUALIFIER: env:SA_ARTIFACT_QUALIFIER
  SA_ARTIFACT_PROMOTER: env:SA_ARTIFACT_PROMOTER
  BINAUTHZ_BUILD_ATTESTOR_PROJECT: env:BINAUTHZ_BUILD_ATTESTOR_PROJECT
  BINAUTHZ_BUILD_ATTESTOR: env:BINAUTHZ_BUILD_ATTESTOR
  BINAUTHZ_BUILD_ATTESTOR_KEY_VERSION: env:BINAUTHZ_BUILD_ATTESTOR_KEY_VERSION
  BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT: env:BINAUTHZ_QUALIFICATION_ATTESTOR_PROJECT
  BINAUTHZ_QUALIFICATION_ATTESTOR: env:BINAUTHZ_QUALIFICATION_ATTESTOR
  BINAUTHZ_QUALIFICATION_ATTESTOR_KEY_VERSION: env:BINAUTHZ_QUALIFICATION_ATTESTOR_KEY_VERSION
  BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: env:BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT
  BINAUTHZ_DEPLOYMENT_ATTESTOR: env:BINAUTHZ_DEPLOYMENT_ATTESTOR
  BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION: env:BINAUTHZ_DEPLOYMENT_ATTESTOR_KEY_VERSION
  SA_ARTIFACT_SIGNER: env:SA_ARTIFACT_SIGNER
  ARC_PROMOTER_APP_ID: env:ARC_PROMOTER_APP_ID
  ARC_PROMOTER_SECRET_PROJECT: env:ARC_PROMOTER_SECRET_PROJECT
  ARC_PROMOTER_PRIVATE_KEY_SECRET: env:ARC_PROMOTER_PRIVATE_KEY_SECRET
  ARC_PROMOTER_PRIVATE_KEY_VERSION: env:ARC_PROMOTER_PRIVATE_KEY_VERSION
