---
# Contract-level OIDC policy for the github-config repository.
# Source of truth: catalog/oidc-policy.yaml — this file declares the contract binding.
# Every key below is present for direct and reusable GitHub Actions jobs. Optional
# claims such as environment and job_workflow_ref are intentionally excluded:
# requiring either organization-wide would prevent ordinary plan/validation jobs
# from obtaining an OIDC token.
subject_claim_keys:
  - repository_owner_id
  - repository_id
  - repository
  - workflow_ref
  - ref
required_wif_attribute_claims:
  - repository_owner_id
  - repository_id
  - repository
  - workflow_ref
  - ref
  - event_name
# Bootstrap's exact plan/release bindings use GitHub's immutable default, environment-shaped
# `sub`: repo:OWNER@OWNER-ID/REPO@REPO-ID:environment:NAME. Keep every managed repository
# explicitly opted out of custom templates; the organization template below is dormant policy
# metadata. Older repositories must separately opt in to GitHub immutable default subjects.
repository_opt_in: false
require_immutable_default_subject: true
require_trusted_owner_id: true
require_repository_id: true
require_workflow_ref: true
require_ref: true
require_protected_environment_for_sensitive_plan: true
require_protected_environment_for_apply: true
explicit_audience_required: true
