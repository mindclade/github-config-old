name: Publish DR evidence

on:
  workflow_dispatch:
    inputs:
      report_path:
        description: Repository-relative path to the completed report v2.
        required: true
        type: string
      environment:
        description: Protected drill environment.
        required: true
        type: choice
        options:
          - scratch
          - staging
      observer_operator:
        description: GitHub login of the independent drill observer.
        required: true
        type: string

permissions: {}

jobs:
  activation-blocked:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain the protected activation gate
        shell: bash
        run: |
          echo "DR evidence publication remains blocked until v5_release_published is qualified."
          echo "Publish and qualify the immutable shared-workflow release before activation."
          exit 1
